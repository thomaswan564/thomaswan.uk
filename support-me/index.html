    justify-content:center;

    color:#1d1d1f;

.container {
    width:90%;

.support-box {

.pay-button {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    height:55px;
    margin:15px 0;
    border-radius:16px;
    text-decoration:none;
    font-size:17px;
    font-weight:600;
    transition:
    transform .2s,
    opacity .2s;
}
.pay-button:hover {
    transform:scale(1.03);
    opacity:.85;
}
.note {
    margin-top:30px;
    font-size:13px;
    color:#86868b;

.footer {
    margin-top:35px;
