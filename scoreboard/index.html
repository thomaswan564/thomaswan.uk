<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>Sports Scoreboard</title>


<style>

html,body{

margin:0;

width:100%;
height:100%;

background:transparent;

overflow:hidden;

}


.scoreboard{

width:1920px;

height:1080px;

color:white;

font-family:
"Microsoft YaHei",
Arial,
sans-serif;

text-align:center;

text-shadow:
0 0 10px black;

}


.event{

font-size:70px;

margin-top:80px;

font-weight:bold;

}



.timer{

font-size:150px;

font-weight:bold;

margin-top:80px;

}



.players{

display:flex;

justify-content:center;

gap:100px;

margin-top:100px;

}



.player{

font-size:45px;

background:
rgba(0,0,0,0.4);

padding:20px 50px;

border-radius:20px;

}


</style>


</head>



<body>


<div class="scoreboard">


<div class="event">

男子100米決賽

</div>



<div class="timer" id="timer">

00:00.00

</div>



<div class="players">


<div class="player">

<div>第1道</div>

<div>張三</div>

</div>



<div class="player">

<div>第2道</div>

<div>李四</div>

</div>



<div class="player">

<div>第3道</div>

<div>王五</div>

</div>



</div>



</div>





<script>


let startTime = 0;

let elapsedTime = 0;

let running = false;



const timer =
document.getElementById("timer");



function updateTimer(){


if(running){

elapsedTime =
Date.now()
-
startTime;

}



let seconds =
Math.floor(
elapsedTime / 1000
);



let ms =
Math.floor(
(elapsedTime % 1000) / 10
);



timer.innerHTML =

String(seconds)
.padStart(2,"0")

+

":"

+

String(ms)
.padStart(2,"0");

}



setInterval(
updateTimer,
30
);





document.addEventListener(
"keydown",
function(e){



// 空格 開始/暫停

if(e.code==="Space"){


if(running){


elapsedTime =
Date.now()
-
startTime;


running=false;



}else{


startTime =
Date.now()
-
elapsedTime;


running=true;


}


}





// R鍵重置

if(e.code==="KeyR"){


running=false;

elapsedTime=0;


}


});



</script>



</body>

</html>
